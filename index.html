<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Engine & Task Prioritizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    body { background-color: #0b0f19; color: #f3f4f6; }
    .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-sidebar { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body x-data="taskApp()" x-init="initData()" class="min-h-screen text-slate-200 font-sans antialiased">

  <!-- Header / Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/20 border border-indigo-500/30 rounded-lg text-indigo-400">
          <i class="fa-solid fa-microchip text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">Focus Engine & Task Prioritizer</h1>
          <p class="text-xs text-slate-400">Eisenhower Matrix & Dynamic Task Execution</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center space-x-1">
          <button @click="currentTab = 'list'" :class="currentTab === 'list' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5">
            <i class="fa-solid fa-list-check"></i> <span>List View</span>
          </button>
          <button @click="currentTab = 'matrix'" :class="currentTab === 'matrix' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center space-x-1.5">
            <i class="fa-solid fa-table-cells-large"></i> <span>Eisenhower Matrix</span>
          </button>
        </div>

        <button @click="autoPrioritize()" class="px-3.5 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold rounded-xl shadow-lg border border-purple-400/30 flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Auto-Prioritize</span>
        </button>

        <button @click="showAddModal = true" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl shadow-lg transition flex items-center space-x-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>Add Task</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    
    <!-- List View Content -->
    <div x-show="currentTab === 'list'" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Main Task List Column -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Filter Controls -->
        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center space-x-2 flex-wrap gap-y-2">
            <button @click="selectedCategory = 'All'" :class="selectedCategory === 'All' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-xl text-xs font-medium transition">
              All (<span x-text="tasks.length"></span>)
            </button>
            <template x-for="cat in categories" :key="cat">
              <button @click="selectedCategory = cat" :class="selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                <span x-text="cat"></span>
                <span class="text-[10px] opacity-70" x-text="`(${tasks.filter(t => t.category === cat).length})`"></span>
              </button>
            </template>
          </div>

          <div class="flex items-center space-x-2">
            <span class="text-xs text-slate-400">Filter:</span>
            <select x-model="selectedPriority" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none">
              <option value="All">All Priorities</option>
              <option value="P1">P1 - Critical</option>
              <option value="P2">P2 - High</option>
              <option value="P3">P3 - Medium</option>
              <option value="P4">P4 - Low</option>
            </select>
          </div>
        </div>

        <!-- Task List Items -->
        <div class="space-y-4">
          <div class="flex items-center justify-between text-xs font-bold tracking-wider text-slate-400 uppercase px-1">
            <span>Tasks (<span x-text="filteredTasks().length"></span>)</span>
          </div>

          <template x-for="task in filteredTasks()" :key="task.id">
            <div class="glass-card rounded-2xl border border-slate-800/80 transition-all overflow-hidden">
              
              <!-- Card Header -->
              <div class="p-4 flex items-center justify-between cursor-pointer" @click="toggleTaskExpand(task.id)">
                <div class="flex items-center space-x-3 flex-1 min-w-0">
                  <input type="checkbox" :checked="task.completed" @click.stop="toggleTaskCompleted(task.id)" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500">
                  <div class="flex flex-col min-w-0">
                    <div class="flex items-center space-x-2">
                      <span class="text-xs px-2 py-0.5 rounded-md bg-indigo-950/80 text-indigo-300 border border-indigo-800/50 font-medium" x-text="task.category"></span>
                      <span :class="priorityBadgeClass(task.priority)" class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase" x-text="task.priority"></span>
                    </div>
                    <h3 class="font-semibold text-sm text-slate-100 truncate mt-1" :class="task.completed ? 'line-through text-slate-500' : ''" x-text="task.title"></h3>
                  </div>
                </div>

                <div class="flex items-center space-x-3 ml-4">
                  <button @click.stop="toggleTaskExpand(task.id)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid text-sm" :class="expandedTasks[task.id] ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                  </button>
                </div>
              </div>

              <!-- Expanded Details & Sub-Tasks -->
              <div x-show="expandedTasks[task.id]" x-collapse class="px-4 pb-4 pt-2 border-t border-slate-800/60 bg-slate-950/30 space-y-4">
                
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Category</label>
                    <select x-model="task.category" @change="saveTasks()" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-slate-300">
                      <template x-for="cat in categories" :key="cat">
                        <option :value="cat" x-text="cat"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Deadline Date</label>
                    <input type="date" x-model="task.dueDate" @change="saveTasks()" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-slate-300">
                  </div>
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Urgent?</label>
                    <select x-model="task.urgent" @change="updatePriorityFromMatrix(task)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-slate-300">
                      <option :value="true">Yes (Urgent)</option>
                      <option :value="false">No (Not Urgent)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Important?</label>
                    <select x-model="task.important" @change="updatePriorityFromMatrix(task)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-slate-300">
                      <option :value="true">Yes (Important)</option>
                      <option :value="false">No (Not Important)</option>
                    </select>
                  </div>
                </div>

                <!-- Sub-Tasks Checklist Section -->
                <div>
                  <h4 class="text-xs font-semibold text-slate-300 mb-2 flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>Sub-Tasks Checklist:</span>
                  </h4>

                  <div class="space-y-2">
                    <template x-for="(sub, sIndex) in task.subtasks" :key="sIndex">
                      <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900/60 border border-slate-800 text-xs">
                        <label class="flex items-center space-x-2 flex-1 cursor-pointer">
                          <input type="checkbox" x-model="sub.completed" @change="saveTasks()" class="rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500">
                          <span :class="sub.completed ? 'line-through text-slate-500' : 'text-slate-200'" x-text="sub.text"></span>
                        </label>
                        <button @click="removeSubtask(task, sIndex)" class="text-slate-500 hover:text-red-400 px-1">
                          <i class="fa-solid fa-xmark"></i>
                        </button>
                      </div>
                    </template>
                  </div>

                  <!-- Add Sub-task Input -->
                  <div class="mt-3 flex items-center space-x-2">
                    <input type="text" x-model="newSubtaskInputs[task.id]" @keydown.enter.prevent="addSubtask(task)" placeholder="Type custom sub-task and press Enter..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    <button @click="addSubtask(task)" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">
                      Add Sub-task
                    </button>
                  </div>
                </div>

                <div class="flex justify-end pt-2 border-t border-slate-800/40">
                  <button @click="deleteTask(task.id)" class="text-xs text-red-400 hover:text-red-300 font-medium px-2 py-1 rounded hover:bg-red-950/30 transition">
                    Delete Task
                  </button>
                </div>

              </div>
            </div>
          </template>
        </div>

      </div>

      <!-- Right Sidebar: Execution Queue -->
      <div class="lg:col-span-5">
        <div class="glass-sidebar p-5 rounded-2xl sticky top-20 border border-indigo-900/30">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-white flex items-center space-x-2">
              <i class="fa-solid fa-bolt text-amber-400"></i>
              <span>Top Recommended Priorities</span>
            </h2>
            <span class="text-[10px] bg-indigo-950 border border-indigo-800/60 text-indigo-300 px-2 py-0.5 rounded-full font-semibold">Execution Queue</span>
          </div>

          <div class="space-y-3">
            <template x-for="(task, index) in topPriorities()" :key="task.id">
              <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 flex flex-col space-y-2">
                <div class="flex items-start justify-between">
                  <div class="flex items-start space-x-2">
                    <span class="w-5 h-5 rounded-full bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 flex items-center justify-center text-[10px] font-bold mt-0.5" x-text="index + 1"></span>
                    <p class="text-xs font-medium text-slate-200 leading-tight" x-text="task.title"></p>
                  </div>
                  <span :class="priorityBadgeClass(task.priority)" class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase ml-2" x-text="task.priority"></span>
                </div>

                <!-- Active Sub-task Action -->
                <template x-if="firstIncompleteSubtask(task)">
                  <div class="flex items-center justify-between bg-slate-950/80 p-2 rounded-lg border border-slate-800/80 text-xs">
                    <div class="flex items-center space-x-2 overflow-hidden">
                      <i class="fa-solid fa-circle-arrow-right text-indigo-400 text-xs"></i>
                      <span class="text-slate-300 truncate text-[11px]" x-text="firstIncompleteSubtask(task).text"></span>
                    </div>
                    <button @click="toggleSubtaskComplete(task, firstIncompleteSubtask(task))" class="ml-2 px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-[10px] font-semibold transition">
                      Done
                    </button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

    </div>

    <!-- Eisenhower Matrix View -->
    <div x-show="currentTab === 'matrix'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Do First -->
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-red-500">
        <h3 class="font-bold text-sm text-red-400 mb-3"><i class="fa-solid fa-fire mr-1.5"></i> Do First (Urgent & Important)</h3>
        <div class="space-y-2">
          <template x-for="t in tasks.filter(x => x.urgent && x.important)" :key="t.id">
            <div class="p-2.5 bg-slate-900/80 rounded-xl text-xs border border-slate-800 flex justify-between items-center">
              <span x-text="t.title" class="font-medium"></span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-red-950 text-red-300" x-text="t.category"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Schedule -->
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-amber-500">
        <h3 class="font-bold text-sm text-amber-400 mb-3"><i class="fa-regular fa-calendar-check mr-1.5"></i> Schedule (Not Urgent & Important)</h3>
        <div class="space-y-2">
          <template x-for="t in tasks.filter(x => !x.urgent && x.important)" :key="t.id">
            <div class="p-2.5 bg-slate-900/80 rounded-xl text-xs border border-slate-800 flex justify-between items-center">
              <span x-text="t.title" class="font-medium"></span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-amber-950 text-amber-300" x-text="t.category"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Delegate -->
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-blue-500">
        <h3 class="font-bold text-sm text-blue-400 mb-3"><i class="fa-solid fa-user-gear mr-1.5"></i> Delegate (Urgent & Not Important)</h3>
        <div class="space-y-2">
          <template x-for="t in tasks.filter(x => x.urgent && !x.important)" :key="t.id">
            <div class="p-2.5 bg-slate-900/80 rounded-xl text-xs border border-slate-800 flex justify-between items-center">
              <span x-text="t.title" class="font-medium"></span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-blue-950 text-blue-300" x-text="t.category"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Don't Do / Eliminate -->
      <div class="glass-card p-4 rounded-2xl border-l-4 border-l-slate-500">
        <h3 class="font-bold text-sm text-slate-400 mb-3"><i class="fa-solid fa-trash-can mr-1.5"></i> Eliminate (Not Urgent & Not Important)</h3>
        <div class="space-y-2">
          <template x-for="t in tasks.filter(x => !x.urgent && !x.important)" :key="t.id">
            <div class="p-2.5 bg-slate-900/80 rounded-xl text-xs border border-slate-800 flex justify-between items-center">
              <span x-text="t.title" class="font-medium"></span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-slate-950 text-slate-400" x-text="t.category"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Modal: Add Task -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div class="glass-card p-6 rounded-2xl w-full max-w-md border border-slate-700 space-y-4">
        <h3 class="text-base font-bold text-white">Create New Task</h3>
        <input type="text" x-model="newTask.title" placeholder="Task Title..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
        <div class="grid grid-cols-2 gap-3">
          <select x-model="newTask.category" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
            <template x-for="c in categories" :key="c"><option :value="c" x-text="c"></option></template>
          </select>
          <select x-model="newTask.priority" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
            <option value="P1">P1 - Critical</option>
            <option value="P2">P2 - High</option>
            <option value="P3">P3 - Medium</option>
            <option value="P4">P4 - Low</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button @click="showAddModal = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
          <button @click="addNewTask()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">Save Task</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    function taskApp() {
      return {
        currentTab: 'list',
        selectedCategory: 'All',
        selectedPriority: 'All',
        showAddModal: false,
        categories: ['Wave Commerce', 'Personal'],
        expandedTasks: {},
        newSubtaskInputs: {},
        newTask: { title: '', category: 'Wave Commerce', priority: 'P1', urgent: true, important: true },

        defaultTasks: [
          {
            id: 1,
            title: 'President Luggage: Arrange Japan Partner Meeting',
            category: 'Wave Commerce',
            priority: 'P1',
            dueDate: '2026-10-05',
            urgent: true,
            important: true,
            completed: false,
            subtasks: [
              { text: 'Draft outreach email with available JST slots', completed: false },
              { text: 'Send email to Japan partner contacts', completed: false }
            ]
          },
          {
            id: 2,
            title: 'New Era: Arrange Klaviyo Meeting w/ Daniel & Han',
            category: 'Wave Commerce',
            priority: 'P1',
            dueDate: '2026-10-02',
            urgent: true,
            important: true,
            completed: false,
            subtasks: [
              { text: 'Check internal availability for Daniel & Han', completed: false }
            ]
          },
          {
            id: 3,
            title: 'POS: Prepare for POS Meeting',
            category: 'Wave Commerce',
            priority: 'P1',
            dueDate: '2026-10-01',
            urgent: true,
            important: true,
            completed: false,
            subtasks: [
              { text: 'Review key open technical items for POS', completed: false }
            ]
          }
        ],

        tasks: [],

        initData() {
          const saved = localStorage.getItem('focus_engine_tasks');
          if (saved) {
            try {
              this.tasks = JSON.parse(saved);
            } catch(e) {
              this.tasks = this.defaultTasks;
            }
          } else {
            this.tasks = this.defaultTasks;
            this.saveTasks();
          }
          // Default first task open
          if (this.tasks.length > 0) {
            this.expandedTasks[this.tasks[0].id] = true;
          }
        },

        saveTasks() {
          localStorage.setItem('focus_engine_tasks', JSON.stringify(this.tasks));
        },

        filteredTasks() {
          return this.tasks.filter(t => {
            const matchesCat = this.selectedCategory === 'All' || t.category === this.selectedCategory;
            const matchesPrio = this.selectedPriority === 'All' || t.priority === this.selectedPriority;
            return matchesCat && matchesPrio;
          });
        },

        topPriorities() {
          return this.tasks.filter(t => !t.completed).slice(0, 3);
        },

        firstIncompleteSubtask(task) {
          return task.subtasks ? task.subtasks.find(s => !s.completed) : null;
        },

        toggleTaskExpand(taskId) {
          this.expandedTasks[taskId] = !this.expandedTasks[taskId];
        },

        toggleTaskCompleted(taskId) {
          const t = this.tasks.find(x => x.id === taskId);
          if (t) {
            t.completed = !t.completed;
            this.saveTasks();
          }
        },

        toggleSubtaskComplete(task, sub) {
          sub.completed = true;
          this.saveTasks();
        },

        addSubtask(task) {
          const input = this.newSubtaskInputs[task.id];
          if (input && input.trim() !== '') {
            if (!task.subtasks) task.subtasks = [];
            task.subtasks.push({ text: input.trim(), completed: false });
            this.newSubtaskInputs[task.id] = '';
            this.saveTasks();
          }
        },

        removeSubtask(task, index) {
          task.subtasks.splice(index, 1);
          this.saveTasks();
        },

        deleteTask(taskId) {
          this.tasks = this.tasks.filter(t => t.id !== taskId);
          this.saveTasks();
        },

        addNewTask() {
          if (!this.newTask.title.trim()) return;
          const created = {
            id: Date.now(),
            title: this.newTask.title,
            category: this.newTask.category,
            priority: this.newTask.priority,
            dueDate: '',
            urgent: this.newTask.urgent,
            important: this.newTask.important,
            completed: false,
            subtasks: []
          };
          this.tasks.unshift(created);
          this.saveTasks();
          this.newTask.title = '';
          this.showAddModal = false;
        },

        updatePriorityFromMatrix(task) {
          if (task.urgent && task.important) task.priority = 'P1';
          else if (!task.urgent && task.important) task.priority = 'P2';
          else if (task.urgent && !task.important) task.priority = 'P3';
          else task.priority = 'P4';
          this.saveTasks();
        },

        autoPrioritize() {
          this.tasks.sort((a, b) => {
            const pMap = { P1: 1, P2: 2, P3: 3, P4: 4 };
            return (pMap[a.priority] || 4) - (pMap[b.priority] || 4);
          });
          this.saveTasks();
        },

        priorityBadgeClass(p) {
          switch(p) {
            case 'P1': return 'bg-red-900/60 text-red-300 border border-red-700/50';
            case 'P2': return 'bg-amber-900/60 text-amber-300 border border-amber-700/50';
            case 'P3': return 'bg-blue-900/60 text-blue-300 border border-blue-700/50';
            default: return 'bg-slate-800 text-slate-400';
          }
        }
      }
    }
  </script>
</body>
</html>
